[functions.enrich-word]
verify_jwt = false
[functions.dependency-engine]
enabled = true
verify_jwt = false
import_map = "./functions/dependency-engine/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/dependency-engine/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/dependency-engine/*.html" ]

[functions.completion-contract-shadow]
enabled = true
verify_jwt = false
import_map = "./functions/completion-contract-shadow/deno.json"
entrypoint = "./functions/completion-contract-shadow/index.ts"

[functions.analyze-text]
enabled = true
verify_jwt = true
import_map = "./functions/analyze-text/deno.json"
entrypoint = "./functions/analyze-text/index.ts"

[functions.get-job-status]
enabled = true
verify_jwt = true
import_map = "./functions/get-job-status/deno.json"
entrypoint = "./functions/get-job-status/index.ts"

[functions.job-completion-auditor]
enabled = true
verify_jwt = true
import_map = "./functions/import_map.json"
entrypoint = "./functions/job-completion-auditor/index.ts"

[functions.pipeline-supervisor]
enabled = true
verify_jwt = true
import_map = "./functions/import_map.json"
entrypoint = "./functions/pipeline-supervisor/index.ts"

# D10 source-only shadow. This entry prepares local configuration only; the
# function is not part of the current pipeline and must not be deployed before
# the D09 gate described in docs/architecture/authoritative-morphology-v2.md.
[functions.forms-enrichment-v2-shadow]
enabled = true
verify_jwt = false
import_map = "./functions/forms-enrichment-v2-shadow/deno.json"
entrypoint = "./functions/forms-enrichment-v2-shadow/index.ts"

[functions.forms-enrichment-v2-worker]
enabled = true
verify_jwt = true
import_map = "./functions/forms-enrichment-v2-worker/deno.json"
entrypoint = "./functions/forms-enrichment-v2-worker/index.ts"
